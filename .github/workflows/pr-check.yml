name: PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Release Assemble + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate throwaway keystore
        run: |
          keytool -genkeypair \
            -keystore /tmp/pr-check.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 30 \
            -storepass android -keypass android \
            -dname "CN=PR Check, OU=CI, O=KFU"

      - name: Assemble release + run unit tests
        env:
          KEYSTORE_PATH: /tmp/pr-check.jks
          STORE_PASSWORD: android
          KEY_ALIAS: upload
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease testDebugUnitTest --parallel --build-cache
