name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the latest version to raise"
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor
      version_name:
        description: "Exact version instead (for example 1.4). Must be higher than the latest release."
        required: false
        type: string
      commit:
        description: "Release the APK that the Build APK workflow already produced for this commit (full or short SHA). The version is read from that APK, so bump and version_name are ignored. Leave empty to build a new release."
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Choose version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version || steps.reuse.outputs.version }}
      code: ${{ steps.version.outputs.code || steps.reuse.outputs.code }}
      previous: ${{ steps.version.outputs.previous || steps.reuse.outputs.previous }}
      sha: ${{ steps.commit.outputs.sha || steps.reuse.outputs.sha }}
      reuse: ${{ steps.reuse.outputs.reuse }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse the APK built for a commit
        id: reuse
        if: inputs.commit != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --verify "$COMMIT^{commit}")"
          RUN="$(gh run list --workflow build.yml --commit "$SHA" --status success --json databaseId --jq '.[0].databaseId // empty' --limit 1)"
          if [ -z "$RUN" ]; then
            echo "::error::No successful Build APK run exists for commit $SHA. Wait for it to finish, or leave commit empty to build a new release."
            exit 1
          fi
          gh run download "$RUN" --name android-release --dir reused
          APK="$(find reused -name '*.apk' -print -quit)"
          AAB="$(find reused -name '*.aab' -print -quit)"
          test -f "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          NEW="$(sed -nE "s/.*versionName='([^']*)'.*/\1/p" <<< "$BADGING" | head -n1)"
          CODE="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<< "$BADGING" | head -n1)"
          if [ -z "$NEW" ] || [ -z "$CODE" ]; then
            echo "::error::Could not read the version from the APK."
            exit 1
          fi

          PREVIOUS="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)"
          if git rev-parse -q --verify "refs/tags/v$NEW" > /dev/null || gh release view "v$NEW" > /dev/null 2>&1; then
            echo "::error::Version $NEW already exists. Raise the version in the code, let Build APK run again, then release that commit."
            exit 1
          fi
          if [ -n "$PREVIOUS" ]; then
            HIGHEST="$(printf '%s\n%s\n' "${PREVIOUS#v}" "$NEW" | sort -V | tail -n1)"
            if [ "$HIGHEST" != "$NEW" ]; then
              echo "::error::Version $NEW must be higher than the latest release (${PREVIOUS#v})."
              exit 1
            fi
          fi

          mkdir -p renamed
          cp "$APK" "renamed/KFU-Portal-v$NEW.apk"
          if [ -f "$AAB" ]; then cp "$AAB" "renamed/KFU-Portal-v$NEW.aab"; fi
          {
            echo "reuse=true"
            echo "sha=$SHA"
            echo "version=$NEW"
            echo "code=$CODE"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the reused files
        if: inputs.commit != ''
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: renamed/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Work out the new version
        id: version
        if: inputs.commit == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          REQUESTED: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          FILE="app/build.gradle.kts"
          read_code() { sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' | head -n1; }
          read_name() { sed -nE 's/.*[[:space:]]versionName[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' | head -n1; }

          PREVIOUS="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)"
          if [ -n "$PREVIOUS" ]; then
            PREVIOUS_NAME="${PREVIOUS#v}"
            PREVIOUS_CODE=0
            for OLD in "$FILE"; do
              if git cat-file -e "$PREVIOUS:$OLD" 2> /dev/null; then
                PREVIOUS_CODE="$(git show "$PREVIOUS:$OLD" | read_code)"
                break
              fi
            done
            PREVIOUS_CODE="${PREVIOUS_CODE:-0}"
          else
            PREVIOUS_NAME="$(read_name < "$FILE")"
            PREVIOUS_CODE=0
          fi
          CURRENT_CODE="$(read_code < "$FILE")"

          if [ -n "$REQUESTED" ]; then
            NEW="$REQUESTED"
            if ! [[ "$NEW" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::version_name must look like 1.4 or 1.4.1"
              exit 1
            fi
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$PREVIOUS_NAME"
            MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
            case "$BUMP" in
              major) NEW="$((MAJOR + 1)).0" ;;
              minor) NEW="$MAJOR.$((MINOR + 1))" ;;
              patch) NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          fi

          if git rev-parse -q --verify "refs/tags/v$NEW" > /dev/null || gh release view "v$NEW" > /dev/null 2>&1; then
            echo "::error::Version $NEW already exists. A published version is never replaced; choose a higher one."
            exit 1
          fi
          HIGHEST="$(printf '%s\n%s\n' "$PREVIOUS_NAME" "$NEW" | sort -V | tail -n1)"
          if [ "$HIGHEST" != "$NEW" ] || [ "$NEW" = "$PREVIOUS_NAME" ]; then
            echo "::error::Version $NEW must be higher than the latest release ($PREVIOUS_NAME)."
            exit 1
          fi

          CODE=$(( (PREVIOUS_CODE > CURRENT_CODE ? PREVIOUS_CODE : CURRENT_CODE) + 1 ))
          sed -i -E "s/(^|[[:space:]])versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/\1versionName = \"$NEW\"/" "$FILE"
          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $CODE/" "$FILE"
          grep -nE 'versionCode|[[:space:]]versionName' "$FILE"

          {
            echo "version=$NEW"
            echo "code=$CODE"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

      - name: Commit the version
        id: commit
        if: inputs.commit == ''
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required for a published release, so every release is signed with the same key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PASSWORD: ${{ secrets.PASSWORD }}
          STORE_PASSWORD: ${{ secrets.PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease \
            --build-cache --parallel --console=plain

      - name: Collect files
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          APK="$(find app -type f -path "*/build/outputs/apk/release/*.apk" ! -name '*-unaligned.apk' -print -quit)"
          test -f "$APK"
          cp "$APK" "$OUT/KFU-Portal-v$VERSION.apk"
          AAB="$(find app -type f -path "*/build/outputs/bundle/release/*.aab" -print -quit)"
          test -f "$AAB"
          cp "$AAB" "$OUT/KFU-Portal-v$VERSION.aab"
          ls -lh "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ env.OUT }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dl
          merge-multiple: true

      - name: Write the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          {
            if [ -n "$PREVIOUS" ]; then
              echo "## Changes since $PREVIOUS"
              echo
              git log --no-merges --pretty='- %s (%h)' "$PREVIOUS..$SHA" | grep -v -E '^- Release v[0-9]' || true
              echo
              echo "**Total:** $(git diff --shortstat "$PREVIOUS" "$SHA")"
              echo
              echo "Full diff: ${{ github.server_url }}/${{ github.repository }}/compare/$PREVIOUS...v$VERSION"
            else
              echo "## First release"
              echo
              git log --no-merges --pretty='- %s (%h)' "$SHA"
            fi
          } > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists and is never replaced."
            exit 1
          fi
          FILES=("dl/KFU-Portal-v$VERSION.apk" "dl/KFU-Portal-v$VERSION.aab")
          gh release create "v$VERSION" "${FILES[@]}" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --target "$SHA" \
            --latest
